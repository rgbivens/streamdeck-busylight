<!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8" />
        <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover">
        <meta name=apple-mobile-web-app-capable content=yes>
        <meta name=apple-mobile-web-app-status-bar-style content=black>
        <title>com.pedropombeiro.streamdeck-busylight Property Inspector</title>
        <link rel="stylesheet" href="css/sdpi.css">
        <style>
          .sdpi-item-label {
            width: 90px;
            transform: none;
          }

          .sdpi-item > select.sdpi-item-value {
            box-sizing: border-box;
            flex: 0 0 calc(var(--sdpi-width) + 16px);
            width: calc(var(--sdpi-width) + 16px);
            margin-left: 5px;
            margin-right: 14px;
          }
        </style>
    </head>
    <body>
        <div class="sdpi-wrapper">
          <div class="sdpi-item">
            <div class="sdpi-item-label">Color</div>
              <select class="sdpi-item-value select" id="colorSelect">
                <option value="off">Off</option>
                <option value="red">Red</option>
                <option value="green">Green</option>
                <option value="yellow">Yellow</option>
                <option value="blue">Blue</option>
                <option value="magenta">Pink</option>
                <option value="cyan">Cyan</option>
                <option value="white">White</option>
                <option value="orange">Orange</option>
              </select>
          </div>
          <div class="sdpi-item" type="checkbox">
            <div class="sdpi-item-label">Blink</div>
            <div class="sdpi-item-value">
              <input type="checkbox" id="blinkToggle" />
              <label for="blinkToggle"><span></span>Pulse / blink mode</label>
            </div>
          </div>
          <div class="sdpi-item">
            <div class="sdpi-item-label">Sound</div>
              <select class="sdpi-item-value select" id="soundSelect">
                <option value="0">No Sound</option>
                <option value="1">Fairy Tale</option>
                <option value="2">Funky</option>
                <option value="3">Kuando Train</option>
                <option value="4">Open Office</option>
                <option value="5">Quiet</option>
                <option value="6">Telephone Nordic</option>
                <option value="7">Telephone Original</option>
                <option value="8">Telephone Pick Me Up</option>
              </select>
          </div>
          <div class="sdpi-item">
            <div class="sdpi-item-label">Volume</div>
              <select class="sdpi-item-value select" id="volumeSelect">
                <option value="100">100%</option>
                <option value="75">75%</option>
                <option value="50">50%</option>
                <option value="25">25%</option>
                <option value="0">Mute</option>
              </select>
          </div>

        </div>

        <div class="sdpi-info-label hidden" style="top: -1000;" value=""></div>
        <script src="js/common.js"></script>
        <script src="js/index_pi.js"></script>
    </body>
    </html>
